onboarding = false

[terminal]
new_cwd = "follow"

[theme]
auto_switch = true

[theme.custom.dark]
sidebar_bg = "#161616"
active_row_bg = "#2a2a2a"
selection_bg = "#353535"
panel_bg = "#161616"
mauve = "#be95ff"
accent = "#33b1ff"
red = "#ee5396"
green = "#25be6a"
yellow = "#08bdba"
peach = "#f16da6"
text = "#f2f4f8"
subtext0 = "#b6b8bb"
overlay1 = "#7b7c7e"
overlay0 = "#6e6f70"
surface_dim = "#252525"
surface0 = "#353535"
surface1 = "#535353"
blue = "#78a9ff"
teal = "#33b1ff"

[theme.custom.light]
sidebar_bg = "#f2e9e1"
active_row_bg = "#e7d2be"
selection_bg = "#d3c7bb"
panel_bg = "#f6f2ee"
mauve = "#6e33ce"
accent = "#287980"
red = "#a5222f"
green = "#396847"
yellow = "#ac5402"
peach = "#b3434e"
text = "#3d2b5a"
subtext0 = "#643f61"
overlay1 = "#824d5b"
overlay0 = "#837a72"
surface_dim = "#e4dcd4"
surface0 = "#dbd1dd"
surface1 = "#d3c7bb"
blue = "#2848a9"
teal = "#287980"

[keys]
prefix = "ctrl+space"
navigate_pane_left = "ctrl+h"
navigate_pane_right = "ctrl+l"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
next_agent = "ctrl+period"
previous_agent = "ctrl+comma"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "chmarax.gitview.toggle"   # sidebar in the current tab
description = "git view sidebar"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "chmarax.gitview.toggle-tab"   # dedicated gitview tab
description = "git view tab"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/home/max/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

# status_indicators = "symbols"
# agent_panel_sort = "priority"

[ui.toast]
delivery = "system"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#b9cdf2"
# <<< herdr-radar theme block

